# Thoughtbot tmux config with some mods
# improve colors
set -g default-terminal "screen-256color"

# Mouse support
set -g mouse on

# Keep mouse selections highlighted after releasing the button.
# Default tmux behavior usually copies on release and exits copy-mode; this
# changes release to only stop/select, so you can press y or Enter afterwards.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode-emacs MouseDragEnd1Pane send-keys -X stop-selection

# Copy the current selection to the macOS clipboard.
set -s copy-command 'pbcopy'
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-emacs Enter send-keys -X copy-selection-and-cancel

# macOS Sierra needs reattach to user namespace again
set -g default-shell $SHELL
set -g default-command "reattach-to-user-namespace -l ${SHELL}"

# act like vim
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

set -g prefix2 C-s

# Have new windows and panes open in the current directory including the custom
# pipe for vertical splits
unbind |
bind |   split-window -c "#{pane_current_path}" -h
bind %   split-window -c "#{pane_current_path}" -h
bind '"' split-window -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# increase scrollback lines
set -g history-limit 10000

# Notifications from agent hooks: bell/message in current tmux client
set -g visual-bell on
set -g bell-action current

# prefix -> back-one-character
bind-key C-b send-prefix
# prefix-2 -> forward-incremental-history-search
bind-key C-s send-prefix -2

# Faster escape sequences (default is 500ms).
# This helps when exiting insert mode in Vim: http://superuser.com/a/252717/65504
set -s escape-time 50

# TokyoNight colors
set -as terminal-features ",xterm-256color:RGB,screen-256color:RGB"

# status bar
set -g status-style "fg=#a9b1d6,bg=#1a1b26"
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26] "
set -g status-left-length 24
set -g status-right "#[fg=#565f89,bg=#1a1b26]%a %b %d #[fg=#7dcfff,bg=#1a1b26,bold]%H:%M "

# window list
set -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I #[fg=#a9b1d6]#W "
set -g window-status-current-format "#[fg=#c0caf5,bg=#283457,bold] #I #[fg=#c0caf5,bg=#283457,bold]#W "
set -g window-status-activity-style "fg=#e0af68,bg=#1a1b26,bold"
set -g window-status-bell-style "fg=#f7768e,bg=#1a1b26,bold"
set -g window-status-separator ""

# panes and messages
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "fg=#c0caf5,bg=#283457"
set -g mode-style "fg=#1a1b26,bg=#7dcfff,bold"

# allow tmux to send the escape sequences for keys like Home and End, which Vim can use
set -g extended-keys always
set -g extended-keys-format csi-u

set -g allow-passthrough on
